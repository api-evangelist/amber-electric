apis:
- aid: amber-electric:amber-electric-cdr-energy-api
  name: Amber Electric Consumer Data Right Energy API
  description: >-
    Amber's Consumer Data Right energy data-holder surface, mandated by the Australian CDR regime extended
    from banking into energy and administered by the ACCC with standards set by the Data Standards Body.
    Amber is listed on the public CDR Register as an energy data holder brand (dataHolderBrandId 54968899-b7b5-ef11-95f6-6045bd3f1493,
    ABN 98623603805, lastUpdated 2026-07-23) with the public base URI https://public.cdr.amber.com.au.
    The implementation was verified live on 2026-07-27, not merely claimed: the Consumer Data Standards
    discovery endpoints /cds-au/v1/discovery/status and /cds-au/v1/discovery/outages both returned 200
    with conformant CDS payloads, and /.well-known/openid-configuration is served anonymously. Access
    is accredited-only — dynamic client registration at https://secure.cdr.amber.com.au/connect/register
    with private_key_jwt client authentication and PAR, reachable only by an accredited CDR data recipient
    holding a software statement assertion from the CDR Register. No general developer can call it.
  humanURL: https://www.cdr.gov.au/
  baseURL: https://public.cdr.amber.com.au/cds-au/v1
  tags:
  - Consumer Data Right
  - Energy
  - Open Data
  - Regulated
  - OpenID Connect
  - Australia
