name: Amber Electric
kind: company
description: >-
  Amber Electric is an Australian electricity retailer (ABN 98623603805) that
  sells wholesale National Electricity Market pricing straight through to
  residential customers on a flat monthly membership, rather than marking energy
  up, and automates home batteries, solar exports and EV charging against those
  half-hourly prices. It sits at the retail end of the Australian energy value
  chain, between AEMO's wholesale market and the household meter. Its API posture
  is unusually honest and unusually split. Amber publishes a real, verbatim
  OpenAPI 3.0.0 contract for a REST API at https://api.amber.com.au/v1 covering
  sites, prices, forecasts and usage, but the token that unlocks it is generated
  inside the logged-in customer app at https://app.amber.com.au/developers, so
  the API is customer-account-required rather than self-serve — a developer who
  is not an Amber customer cannot obtain a key. One endpoint is the exception:
  the spec explicitly declares `security: []` on
  GET /state/{state}/renewables/current, and that grid renewables-percentage feed
  really does answer anonymously for NSW, VIC, QLD and SA, so open market data
  and gated consumer data live inside the same contract. Separately, Amber is a
  designated Consumer Data Right energy data holder that is genuinely live, not
  merely designated: it is listed on the ACCC CDR Register with a working public
  base URI at https://public.cdr.amber.com.au, whose CDS discovery endpoints and
  anonymously-served OpenID Connect configuration advertise the full Consumer
  Data Standards energy scope set behind private_key_jwt and CDR accreditation.
