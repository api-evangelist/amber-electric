- id: oauth2-dynamic-client-registration-rfc7591
  conforms: true
  surface: cdr
  evidence: >-
    registration_endpoint https://secure.cdr.amber.com.au/connect/register,
    reachable only by an accredited CDR data recipient presenting a software
    statement assertion.
- id: fapi-1.0-advanced
  conforms: true
  surface: cdr
  evidence: >-
    The Consumer Data Standards security profile is built on FAPI 1.0 Advanced,
    and every marker it requires is present in Amber's own discovery document:
    private_key_jwt client authentication, mandatory PAR, PKCE S256, pairwise
    subject identifiers, mTLS-bound access tokens, JARM response mode, PS256/ES256
    signing and acr urn:cds.au:cdr:2. Recorded from those observed markers — no
    OpenID Foundation certification listing for Amber was found.
