note: >-
  Amber publishes exactly one machine-readable discovery document at a
  /.well-known/ path, and it is on the regulated Consumer Data Right host rather
  than on the voluntary product API. api.amber.com.au answers 403 to every
  /.well-known/ path (the edge rejects unknown paths before routing, so 403 here
  means "not served", not "forbidden to you"). The marketing site and customer
  app both answer a clean 404. No security.txt (RFC 9116), no api-catalog
  (RFC 9727), no ai-plugin.json and no RFC 8414 authorization-server metadata
  exist anywhere on the estate.
