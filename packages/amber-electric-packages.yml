source: >-
  PyPI, npm, crates.io, RubyGems, pkg.go.dev and NuGet registry queries plus the
  amberelectric GitHub organisation, run 2026-07-27.
note: >-
  Amber Electric ships exactly one client library that carries a first-party
  signature: the `amberelectric` Python package on PyPI, whose author metadata is
  "Amber Electric Development Team <dev@amber.com.au>" and which is generated by
  OpenAPI Generator directly from Amber's own published contract. Everything else
  in the ecosystem is community-authored. No official JavaScript, Java, .NET, Go,
  Ruby or Rust SDK exists. The registries were queried anonymously and every
  entry below was returned by a live registry API call.
packages:
- language: python
  registry: pypi
  name: amberelectric
  version: 2.0.12
  released: '2024-11-19'
  url: https://pypi.org/project/amberelectric/
  install: pip install amberelectric
  repository: https://github.com/madpilot/amberelectric.py
  license: Apache-2.0
  official: true
  official_evidence: >-
    PyPI `info.author` = "Amber Electric Development Team", `info.author_email`
    = dev@amber.com.au. Generated by OpenAPI Generator 7.10.0
    (PythonPydanticV1ClientCodegen) from the Amber public API contract; the
    package README states "API version: 2.0.0". The source repository sits in a
    personal GitHub account (madpilot / Myles Eftos) rather than the
    amberelectric organisation, which is why this is recorded with the evidence
    rather than asserted flatly.
  python_requires: '>=3.7,<4.0'
  consumed_by:
