notFabricated:
  statement: >-
    Nothing in this profile was invented. Every host, endpoint, scope, status
    code and identifier recorded here was either returned by a live HTTP request
    made on 2026-07-27 or copied verbatim from a document fetched on that date.
    No Green Button, ESPI, OpenADR, IEEE 2030.5, IEC CIM, OCPP or OCPI
    conformance is claimed because none was found. No CDR product reference data
    endpoint is claimed because the probe returned 404. No self-serve developer
    portal is claimed because none exists.
